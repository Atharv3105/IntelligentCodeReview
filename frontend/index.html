<!DOCTYPE html>
<html lang="en" data-theme="dark" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interview Intelligence — AI-Powered Interview Prep</title>
  <meta name="description" content="Practice DSA, SQL, and behavioral interviews with AI-powered simulations. Track your readiness and land your dream offer." />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%232563eb'/><text y='70' x='50' font-size='60' font-family='Arial Black' font-weight='900' fill='white' text-anchor='middle'>II</text></svg>" type="image/svg+xml" />

  <!-- Prevent FOUC: apply dark background immediately before JS loads -->
  <script>
    (function () {
      var theme = localStorage.getItem("iip-theme") || "dark";
      document.documentElement.setAttribute("data-theme", theme);
      if (theme === "dark") document.documentElement.classList.add("dark");
      document.documentElement.style.background = theme === "dark" ? "#060912" : "#f7f8fa";
      document.documentElement.style.colorScheme = theme;
    })();
  </script>

  <!-- Inline critical CSS to prevent layout shift -->
  <style>
    html, body, #root {
      height: 100%;
      margin: 0;
      padding: 0;
    }
    body {
      background: #060912;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    html[data-theme="light"] body {
      background: #f7f8fa;
    }
  </style>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
